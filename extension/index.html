<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <span class="brand">Pluck</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <!-- New version banner (hidden until an update is found) -->
    <div id="banner" class="banner hidden">
      <span id="bannerText" class="grow">A new version of Pluck is available.</span>
      <button class="btn small primary" id="bannerGet">Get update</button>
      <button class="icon-btn" id="bannerClose" title="Dismiss" aria-label="Dismiss">×</button>
    </div>

    <!-- Main view: content is swapped by main.js depending on state -->
    <main id="main"></main>

    <!-- Settings -->
    <section id="settings" class="sheet hidden">
      <div class="sheet-inner">
        <div class="row sheet-head">
          <button class="icon-btn" id="closeSettings" title="Back" aria-label="Back">
            <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <span class="sheet-title">Settings</span>
        </div>

        <div class="set">
          <label class="label" for="setBin">Import into bin</label>
          <input class="input full" id="setBin" value="Web Downloads">
        </div>

        <div class="set">
          <label class="label" for="setQuality">Default quality</label>
          <select class="input full" id="setQuality">
            <option value="1080p">1080p (best)</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="audio">Audio only</option>
          </select>
        </div>

        <div class="set">
          <div class="label">Download tools</div>
          <div class="card engine">
            <span class="led" id="toolsLed"></span>
            <div class="grow">
              <div id="toolsName">Checking…</div>
              <div class="sub" id="toolsSub"></div>
            </div>
          </div>
        </div>

        <div class="set">
          <div class="label">Updates</div>
          <div class="card engine">
            <div class="grow">
              <div>Pluck <span id="aboutVersion"></span></div>
              <div class="sub" id="updateStatus">Pluck checks for new versions once a day.</div>
            </div>
            <button class="btn small" id="updateBtn">Check for updates</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="about">
          <div class="about-name">Pluck</div>
          <div class="sub">Grab videos from the web straight into Premiere.</div>
          <div class="about-maker">Made by <span id="makerHandle"></span></div>
          <button class="btn x-btn full" id="followBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            Follow on X
          </button>
          <div class="sub center">Found a bug, have an idea, or want to help build Pluck? DM me on X.</div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
