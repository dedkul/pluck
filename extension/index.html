<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <span class="brand">Pluck</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </header>

    <!-- Main view: content is swapped by main.js depending on state -->
    <main id="main"></main>

    <!-- Settings -->
    <section id="settings" class="sheet hidden">
      <div class="sheet-inner">
        <div class="row sheet-head">
          <button class="icon-btn" id="closeSettings" title="Back" aria-label="Back">
            <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <span class="sheet-title">Settings</span>
        </div>

        <div class="set">
          <label class="label" for="setFolder">Save downloads to</label>
          <div class="value" id="setFolder">[Project folder]/Web Downloads</div>
          <div class="sub">Next to your project file, so media travels with the project.</div>
        </div>

        <div class="set">
          <label class="label" for="setBin">Import into bin</label>
          <input class="input full" id="setBin" value="Web Downloads">
        </div>

        <div class="set">
          <label class="label" for="setQuality">Default quality</label>
          <select class="input full" id="setQuality">
            <option value="1080p">1080p (best)</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="audio">Audio only</option>
          </select>
        </div>

        <div class="set">
          <div class="label">Download tools</div>
          <div class="card engine">
            <span class="led" id="toolsLed"></span>
            <div class="grow">
              <div id="toolsName">Checking…</div>
              <div class="sub" id="toolsSub"></div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="about">
          <div class="about-name">Pluck <span id="aboutVersion" class="sub"></span></div>
          <div class="sub">Grab videos from the web straight into Premiere.</div>
          <div class="about-maker">Made by <span id="makerHandle"></span></div>
          <button class="btn primary full" id="followBtn">Follow on X</button>
          <div class="sub center">Feedback, ideas or want to help build it? DM me on X.</div>
          <div class="links">
            <a href="#" id="bugLink">Report a bug</a><span class="sub">·</span>
            <a href="#" id="featureLink">Request a feature</a><span class="sub">·</span>
            <a href="#" id="codeLink">Source code</a>
          </div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
